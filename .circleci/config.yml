# Run tests against supported Node versions

version: 2.1

orbs:
  win: circleci/windows@5.0.0
  node: circleci/node@5.0.2

executors:
  node26:
    docker:
      - image: cimg/node:26.0.0
    working_directory: ~/workspace
  node24:
    docker:
      - image: cimg/node:24.0.0
    working_directory: ~/workspace
  node22:
    docker:
      - image: cimg/node:22.0.0
    working_directory: ~/workspace
  node20:
    docker:
      - image: cimg/node:20.0.0
    working_directory: ~/workspace

jobs:
  test:
    parameters:
      executor:
        type: executor
    executor: << parameters.executor >>
    steps:
      - checkout
      - run:
          name: Update npm or delete .npmrc
          command: |
            # This project's .npmrc requires NPM 12.. Upgrade NPM if possible,
            # or delete .npmrc
            #
            # Note: this check may cause spurious warnings about invalid npm
            # settings. npm 11 validates .npmrc even when you just run --version.
            if [ $(npm --version | sed 's/\..*//') -lt 12 ]; then
              if [ $(node --version | sed -e 's/\..*//' -e 's/^v//') -ge 26 ]; then
                npm install -g npm@latest
              else
                # We can't reliably install NPM 12 on anything before Node 26:
                # * NPM 12 won't run on any Node 20 version, or on older 22 and
                #   24 minors.
                # * npm install -g fails on cimg/node:24.* due to permissions.
                # Removing .npmrc theoretically leaves CI vulnerable to supply
                # chain attacks, but CI produces no artifacts and has no access
                # to credentials (except for the Saucelabs API key, and that's
                # only provided to trusted invocations.)
                rm .npmrc
              fi
            fi
      - run:
          name: Report Node and NPM versions
          command: echo "Using Node $(node --version) and NPM $(npm --version)"
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test
  test_win:
    executor:
      name: win/default
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Install Node.js
          command: nvm install 20.0.0 && nvm use 20.0.0
      - run:
          name: Report Node and NPM versions
          command: echo "Using Node $(node --version) and NPM $(npm --version)"
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test

workflows:
  version: 2
  push: &push_workflow
    jobs:
      - test:
          matrix:
            parameters:
              executor:
                - node26
                - node24
                - node22
                - node20
      - test_win
  cron:
    <<: *push_workflow
    triggers:
      - schedule:
          # Times are UTC.
          cron: "0 10 * * *"
          filters:
            branches:
               only:
                 - main
